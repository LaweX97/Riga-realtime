<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Riga - Sledování vozů</title>
    
    <!-- Nastavení pro nativní zobrazení na iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Vozy Riga">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Inter', sans-serif; overflow: hidden; }
        #map { height: 100vh; width: 100%; z-index: 1; }
        .search-panel { z-index: 1000; }
        .vehicle-popup { font-size: 14px; }
        .vehicle-popup strong { color: #1e40af; font-size: 16px; }
    </style>
</head>
<body class="relative">

<!-- Tlačítko s lupou pro rozbalení vyhledávání vlevo nahoře -->
    <div class="absolute top-4 left-4 z-[1000]">
        <button onclick="toggleSearch()" class="bg-white p-3 rounded-full shadow-lg border border-gray-200 text-xl hover:bg-gray-50">
            🔍
        </button>
        
        <!-- Skrytý vyhledávací panel -->
        <div id="searchPanel" class="hidden mt-2 bg-white p-4 rounded-lg shadow-lg border border-gray-200 w-64 sm:w-80">
            <h1 class="text-xl font-bold text-gray-800 mb-2">Riga realtime</h1>
            <div class="flex gap-2">
                <input type="text" id="searchInput" placeholder="Ev. číslo (např. 57124)" 
                       class="border border-gray-300 rounded p-2 w-full focus:outline-none focus:ring-2 focus:ring-blue-500">
                <button onclick="searchVehicle()" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">
                    Najít
                </button>
            </div>
        </div>
    </div>

    <!-- Filtrovací menu vpravo nahoře - na mobilu pod sebou, na PC vedle sebe -->
    <div id="filterMenu" class="absolute top-4 right-4 z-[1000] bg-white p-2 rounded-lg shadow-lg border border-gray-200 flex flex-col sm:flex-row gap-2 max-w-[140px] sm:max-w-none">
        <select id="filterTrakce" onchange="aplikovatFiltry()" class="bg-transparent border-b border-gray-200 pb-1 text-sm focus:outline-none truncate">
            <option value="vse">Všechny trakce</option>
        </select>
        <select id="filterTyp" onchange="aplikovatFiltry()" class="bg-transparent border-b border-gray-200 pb-1 text-sm focus:outline-none truncate">
            <option value="vse">Všechny typy</option>
        </select>
        <select id="filterLinka" onchange="aplikovatFiltry()" class="bg-transparent pb-1 text-sm focus:outline-none truncate">
            <option value="vse">Všechny linky</option>
        </select>
    </div>

    <!-- Informace o stahování - přesunuto dolů doprostřed -->
    <div id="searchResult" class="hidden absolute bottom-8 left-1/2 transform -translate-x-1/2 z-[1000] bg-white px-5 py-2 rounded-full shadow-lg border border-gray-200 text-sm font-bold whitespace-nowrap text-center">
    </div>

    <!-- Mapa -->
    <div id="map"></div>

    <script>
        const map = L.map('map', { zoomControl: false }).setView([56.9496, 24.1052], 13);
                // Definice zelené ikony pro elektrobusy
        const greenIcon = new L.Icon({
            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-green.png',
            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.0.0/images/marker-shadow.png',
            iconSize: [25, 41],
            iconAnchor: [12, 41],
            popupAnchor: [1, -34],
            shadowSize: [41, 41]
        });
        
        let vsechnyVozy = []; // Globální paměť pro stažená data
        
        function naplnitFiltry(data) {
            const trakceSet = new Set();
            const typSet = new Set();
            const linkaSet = new Set();
        
            // Sesbírání všech unikátních hodnot z aktuálních dat
            data.forEach(v => {
                if (v.trakce) trakceSet.add(v.trakce);
                if (v.typ) typSet.add(v.typ);
                if (v.linka) linkaSet.add(v.linka);
            });
        
// Pomocná funkce pro bezpečné naplnění roletky s číselným řazením
            const updateSelect = (id, set, vychoziText) => {
                const select = document.getElementById(id);
                const currentVal = select.value;
                select.innerHTML = `<option value="vse">${vychoziText}</option>`;
                
                // Přirozené číselné řazení (1, 2, 3, 10 místo 1, 10, 2, 3)
                const polozky = Array.from(set).sort((a, b) => {
                    return String(a).localeCompare(String(b), undefined, { numeric: true });
                });

                polozky.forEach(item => {
                    const opt = document.createElement('option');
                    opt.value = item;
                    opt.textContent = item;
                    select.appendChild(opt);
                });
                
                if (set.has(currentVal)) select.value = currentVal;
            };
        
            updateSelect('filterTrakce', trakceSet, 'Všechny trakce');
            updateSelect('filterTyp', typSet, 'Všechny typy');
            updateSelect('filterLinka', linkaSet, 'Všechny linky');
        }
        
        function aplikovatFiltry() {
            const trakceVal = document.getElementById('filterTrakce').value;
            const typVal = document.getElementById('filterTyp').value;
            const linkaVal = document.getElementById('filterLinka').value;
        
            const filtrovano = vsechnyVozy.filter(v => {
                const matchTrakce = (trakceVal === 'vse' || v.trakce === trakceVal);
                const matchTyp = (typVal === 'vse' || v.typ === typVal);
                const matchLinka = (linkaVal === 'vse' || v.linka === linkaVal);
                return matchTrakce && matchTyp && matchLinka;
            });
        
            // Pošle vyfiltrovaná data do vaší stávající vykreslovací funkce
            updateMap(filtrovano);
        }
        L.control.zoom({ position: 'bottomright' }).addTo(map);
        
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap'
        }).addTo(map);

        let vehicleMarkers = {};

// Funkce pro zobrazení/skrytí vyhledávacího panelu
        function toggleSearch() {
            const panel = document.getElementById('searchPanel');
            if (panel.classList.contains('hidden')) {
                panel.classList.remove('hidden');
                document.getElementById('searchInput').focus(); // Rovnou aktivuje klávesnici
            } else {
                panel.classList.add('hidden');
            }
        }
        
      async function fetchVehicles() {
            const resultDiv = document.getElementById('searchResult');
            resultDiv.classList.remove('hidden');
            resultDiv.textContent = 'Stahuji data...';

            try {
                // Dotaz na náš upravený backend
                const response = await fetch('/api/vehicles');
                
                if (!response.ok) {
                    throw new Error(`Chyba serveru: ${response.status}`);
                }
                
                const vehicles = await response.json();
                
                if (vehicles.error) {
                    throw new Error(vehicles.error);
                }

                if (vehicles.length === 0) {
                    throw new Error('Data dorazila, ale seznam vozů je prázdný.');
                }

                vsechnyVozy = vehicles;
                naplnitFiltry(vsechnyVozy);
                aplikovatFiltry();
                
                resultDiv.textContent = `✅ Úspěch: Zobrazeno ${vehicles.length} vozů`;
                resultDiv.style.color = "green";
                setTimeout(() => { resultDiv.classList.add('hidden'); resultDiv.style.color = "red"; }, 3000);

            } catch (error) {
                resultDiv.textContent = `❌ ${error.message}`;
                resultDiv.style.color = "red";
            }
        }
        function updateMap(vehicles) {
            // 1. Vytvoříme si seznam ID všech vozů, které mají na mapě aktuálně být
            const aktivniVozyId = new Set(vehicles.map(v => v.id));

            // 2. Vykreslíme nebo zaktualizujeme vozy
            vehicles.forEach(v => {
                const popupContent = `<b>Linka: ${v.linka}</b><br>Ev. č.: ${v.id}<br>Typ: ${v.typ}<br>Trakce: ${v.trakce}<br>Rok výroby: ${v.rok}`;

                // Nejprve určíme barvu podle trakce nebo typu
                let barvaBodu = '#f59e0b'; // Výchozí oranžová
                
                // Bezpečná detekce: hledá slovo "elektrobus" v trakci i v typu
                const jeElektrobus = (v.trakce && v.trakce.toLowerCase().includes('elektrobus')) || 
                                     (v.typ && v.typ.toLowerCase().includes('elektrobus'));

                if (jeElektrobus) {
                    barvaBodu = '#22c55e'; // Zelená pro elektrobus
                } else if (v.trakce === 'Tramvaj') {
                    barvaBodu = '#ef4444'; // Červená pro tramvaj
                } else if (v.trakce === 'Trolejbus') {
                    barvaBodu = '#3b82f6'; // Modrá pro trolejbus
                }

                if (vehicleMarkers[v.id]) {
                    const marker = vehicleMarkers[v.id];
                    const oldLatLng = marker.getLatLng();
                    const newLatLng = L.latLng(v.lat, v.lng);

                    // Výpočet skutečného směru podle posunu souřadnic
                    if (oldLatLng.lat !== newLatLng.lat || oldLatLng.lng !== newLatLng.lng) {
                        const dy = newLatLng.lat - oldLatLng.lat; 
                        const dx = newLatLng.lng - oldLatLng.lng; 
                        let theta = Math.atan2(dx, dy) * (180 / Math.PI);
                        if (theta < 0) theta += 360;
                        marker.aktualniAzimut = theta; 
                    }

                    // Vytvoření rotující šipky s plynulou animací
                    const sipkaHtml = `
                        <div style="transform: rotate(${marker.aktualniAzimut || 0}deg); transform-origin: center; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.4)); transition: transform 0.5s ease-out;">
                            <svg width="20" height="24" viewBox="0 0 24 24">
                                <path d="M12 2 L22 21 L12 17 L2 21 Z" fill="${barvaBodu}" stroke="white" stroke-width="2"/>
                            </svg>
                        </div>
                    `;
                    
                    const sipkaIcon = L.divIcon({ html: sipkaHtml, className: '', iconSize: [24, 24], iconAnchor: [12, 12], popupAnchor: [0, -14] });

                    marker.setLatLng(newLatLng);
                    marker.setIcon(sipkaIcon);
                    marker.setPopupContent(popupContent);
                } else {
                    // Úplně nový vůz (začíná natočený rovně nahoru)
                    const sipkaHtml = `
                        <div style="transform: rotate(0deg); transform-origin: center; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.4));">
                            <svg width="20" height="24" viewBox="0 0 24 24">
                                <path d="M12 2 L22 21 L12 17 L2 21 Z" fill="${barvaBodu}" stroke="white" stroke-width="2"/>
                            </svg>
                        </div>
                    `;
                    const sipkaIcon = L.divIcon({ html: sipkaHtml, className: '', iconSize: [24, 24], iconAnchor: [12, 12], popupAnchor: [0, -14] });
                    
                    const marker = L.marker([v.lat, v.lng], { icon: sipkaIcon }).addTo(map);
                    marker.aktualniAzimut = 0; 
                    marker.bindPopup(popupContent); 
                    marker.vehicleData = v; 
                    vehicleMarkers[v.id] = marker;
                }
            });

            // 3. Projdeme všechny staré značky a smažeme ty, které neprošly filtrem
            for (const id in vehicleMarkers) {
                if (!aktivniVozyId.has(id)) {
                    map.removeLayer(vehicleMarkers[id]); // Odstraní tečku z mapy
                    delete vehicleMarkers[id]; // Smaže záznam z paměti
                }
            }
        }
        
        function searchVehicle() {
            const id = document.getElementById('searchInput').value.trim();
            const resultDiv = document.getElementById('searchResult');
            document.getElementById('searchInput').blur(); 
            
            if (vehicleMarkers[id]) {
                const marker = vehicleMarkers[id];
                map.flyTo(marker.getLatLng(), 17, { duration: 1.5 });
                setTimeout(() => { marker.openPopup(); }, 1500);
                resultDiv.classList.add('hidden');
                document.getElementById('searchPanel').classList.add('hidden');
            } else {
                resultDiv.textContent = 'Vůz s tímto číslem není aktuálně na mapě.';
                resultDiv.classList.remove('hidden');
            }
        }
        fetchVehicles();
        setInterval(fetchVehicles, 10000);
    </script>
</body>
</html>
