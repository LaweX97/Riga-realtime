<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Riga - Sledování vozů</title>
    
    <!-- Nastavení pro nativní zobrazení na iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Vozy Riga">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Inter', sans-serif; overflow: hidden; }
        #map { height: 100vh; width: 100%; z-index: 1; }
        .search-panel { z-index: 1000; }
        .vehicle-popup { font-size: 14px; }
        .vehicle-popup strong { color: #1e40af; font-size: 16px; }
    </style>
</head>
<body class="relative">

    <div class="search-panel absolute top-4 left-4 right-4 sm:right-auto sm:w-80 bg-white p-4 rounded-lg shadow-lg border border-gray-200">
        <h1 class="text-xl font-bold text-gray-800 mb-2">Dispečink Riga</h1>
        <div class="flex gap-2">
            <input type="text" id="searchInput" placeholder="Evidenční číslo (např. 57124)" 
                   class="border border-gray-300 rounded p-2 flex-grow focus:outline-none focus:ring-2 focus:ring-blue-500">
            <button onclick="searchVehicle()" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 transition">
                Najít
            </button>
        </div>
        <div id="searchResult" class="mt-3 text-sm text-red-600 hidden"></div>
    </div>

    <div id="map"></div>

    <script>
        const map = L.map('map', { zoomControl: false }).setView([56.9496, 24.1052], 13);
        L.control.zoom({ position: 'bottomright' }).addTo(map);
        
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap'
        }).addTo(map);

        let vehicleMarkers = {};

    async function fetchVehicles() {
            const resultDiv = document.getElementById('searchResult');
            resultDiv.classList.remove('hidden');
            resultDiv.textContent = '1/2 Načítám databázi z Renderu...';

            try {
                // 1. Získání vaší databáze
                const dbResponse = await fetch('/api/db');
                const vehicleDb = await dbResponse.json();

                resultDiv.textContent = '2/2 Stahuji GPS přes proxy...';

                // Soukromý Google můstek, který obejde veškeré blokace
                const proxyUrl = 'https://script.google.com/macros/s/AKfycbzRgbRaEFvD3MGzqBdduqRFyHcMCoXGAJ_I8OrFXrq45eH-eez2yydPo_cx7V_tbxyc/exec';

                const gpsResponse = await fetch(proxyUrl);
                
                if (!gpsResponse.ok) {
                    throw new Error(`Proxy hlásí chybu: ${gpsResponse.status}`);
                }

                const rawText = await gpsResponse.text();

                // Pokud Riga místo dat poslala HTML stránku s chybou
                if (rawText.toLowerCase().includes('<html>') || rawText.toLowerCase().includes('<!doctype')) {
                    throw new Error('Riga zablokovala proxy (vrátila HTML).');
                }

                const mapData = [];
                const lines = rawText.split('\n');
                let pocetVozu = 0;

                lines.forEach(line => {
                    const cols = line.trim().split(',');
                    if (cols.length < 8) return; 

                    const linka = cols[1];
                    const lngRaw = parseInt(cols[2], 10);
                    const latRaw = parseInt(cols[3], 10);
                    const vehicleId = cols[7];

                    if (!latRaw || !lngRaw || !vehicleId) return;

                    const lat = latRaw / 1000000;
                    const lng = lngRaw / 1000000;
                    const dbInfo = vehicleDb[vehicleId] || { typ: "Neznámý typ", trakce: "Neznámá" };

                    mapData.push({ id: vehicleId, lat, lng, linka, rychlost: 0, typ: dbInfo.typ, trakce: dbInfo.trakce });
                    pocetVozu++;
                });

                if (pocetVozu === 0) {
                    throw new Error(`Žádné vozy. Ukázka dat: ${rawText.substring(0, 30)}`);
                }

                updateMap(mapData);
                
                // Pokud vše projde, napíše úspěch a za 3 vteřiny hlášku schová
                resultDiv.textContent = `✅ Úspěch: Zobrazeno ${pocetVozu} vozů`;
                resultDiv.style.color = "green";
                setTimeout(() => { resultDiv.classList.add('hidden'); resultDiv.style.color = "red"; }, 3000);

            } catch (error) {
                // Vypíše přesný důvod selhání na obrazovku
                resultDiv.textContent = `❌ ${error.message}`;
                resultDiv.style.color = "red";
                console.error(error);
            }
        }
        function updateMap(vehicles) {
            vehicles.forEach(v => {
                const popupContent = `
                    <div class="vehicle-popup">
                        <strong>Vůz: ${v.id}</strong><br>
                        Linka: <span class="bg-gray-200 px-1 rounded font-bold">${v.linka}</span><br>
                        Typ: ${v.typ}<br>
                        Trakce: ${v.trakce}
                    </div>
                `;

                if (vehicleMarkers[v.id]) {
                    vehicleMarkers[v.id].setLatLng([v.lat, v.lng]);
                    vehicleMarkers[v.id].setPopupContent(popupContent);
                } else {
                    const marker = L.circleMarker([v.lat, v.lng], {
                        radius: 8,
                        fillColor: v.trakce === 'Tramvaj' ? '#ef4444' : (v.trakce === 'Trolejbus' ? '#3b82f6' : '#f59e0b'),
                        color: '#fff',
                        weight: 2,
                        fillOpacity: 0.9
                    }).addTo(map);
                    
                    marker.bindPopup(popupContent);
                    marker.vehicleData = v; 
                    vehicleMarkers[v.id] = marker;
                }
            });
        }

        function searchVehicle() {
            const id = document.getElementById('searchInput').value.trim();
            const resultDiv = document.getElementById('searchResult');
            document.getElementById('searchInput').blur(); 
            
            if (vehicleMarkers[id]) {
                const marker = vehicleMarkers[id];
                map.flyTo(marker.getLatLng(), 17, { duration: 1.5 });
                setTimeout(() => { marker.openPopup(); }, 1500);
                resultDiv.classList.add('hidden');
            } else {
                resultDiv.textContent = 'Vůz s tímto číslem není aktuálně na mapě.';
                resultDiv.classList.remove('hidden');
            }
        }

        fetchVehicles();
        setInterval(fetchVehicles, 10000);
    </script>
</body>
</html>
